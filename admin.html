<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cà Phê Treo Cửa - Imperia Sky Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FBF9F5; }
  </style>
</head>
<body class="text-stone-800 antialiased pb-28">

  <!-- HEADER KHÁCH HÀNG (ĐÃ BỎ Ổ KHÓA ADMIN) -->
  <header class="bg-[#2B170E] text-amber-50 p-4 sticky top-0 z-30 shadow-md flex items-center justify-between border-b border-amber-900/40">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-amber-900/60 rounded-full flex items-center justify-center text-xl border border-amber-600/30">☕</div>
      <div>
        <h1 class="text-sm font-black tracking-wide uppercase text-amber-100">Cà Phê Treo Cửa</h1>
        <p class="text-[11px] text-amber-300/80">Imperia Sky Garden • 06:45 – 07:45</p>
      </div>
    </div>
    <span class="text-[10px] px-2.5 py-1 rounded-full bg-emerald-600 text-white font-bold tracking-wide">Đang nhận đơn</span>
  </header>

  <!-- NỘI DUNG ĐẶT MÓN -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="bg-amber-900/10 border border-amber-900/20 rounded-2xl p-3 flex items-center gap-2.5 text-xs text-amber-950">
      <span class="text-base">⚡</span>
      <p>Pha phin mộc nguyên chất • Đặt trước <b>22:00</b> tối nay để treo cửa đúng hẹn sáng mai.</p>
    </div>

    <section>
      <h2 class="text-xs font-bold text-stone-500 uppercase tracking-wider mb-2.5">Thực đơn sáng mai</h2>
      <div id="menuList" class="space-y-2.5">
        <p class="text-xs text-stone-400 text-center py-6">Đang tải thực đơn...</p>
      </div>
    </section>

    <section class="bg-white p-4 rounded-3xl border border-stone-200 shadow-sm space-y-3">
      <h3 class="font-bold text-xs uppercase tracking-wider text-stone-700">Thông tin nhận cà phê</h3>
      
      <div>
        <label class="text-[11px] font-bold text-stone-500">Số căn hộ chung cư *</label>
        <input type="text" id="roomInput" placeholder="Ví dụ: A2805, B12A08, C0712" oninput="checkFormValid()"
               class="w-full mt-1 border border-stone-300 rounded-xl p-2.5 text-xs outline-none focus:border-amber-900 uppercase font-semibold">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] font-bold text-stone-500">Tên của bạn *</label>
          <input type="text" id="nameInput" placeholder="Tên khách" oninput="checkFormValid()"
                 class="w-full mt-1 border border-stone-300 rounded-xl p-2.5 text-xs outline-none focus:border-amber-900 font-semibold">
        </div>
        <div>
          <label class="text-[11px] font-bold text-stone-500">Số điện thoại *</label>
          <input type="tel" id="phoneInput" placeholder="09xxxxxxxx" oninput="checkFormValid()"
                 class="w-full mt-1 border border-stone-300 rounded-xl p-2.5 text-xs outline-none focus:border-amber-900 font-semibold">
        </div>
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-500">Khung giờ treo cửa sáng mai *</label>
        <select id="timeSlotInput" class="w-full mt-1 border border-stone-300 rounded-xl p-2.5 text-xs outline-none focus:border-amber-900 font-semibold bg-white">
          <option value="06:45 – 07:05">🌅 06:45 – 07:05 (Đi làm sớm)</option>
          <option value="07:05 – 07:25">⏰ 07:05 – 07:25 (Giờ phổ biến)</option>
          <option value="07:25 – 07:45">☀️ 07:25 – 07:45 (Đi làm muộn)</option>
        </select>
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-500">Ghi chú khẩu vị</label>
        <input type="text" id="noteInput" placeholder="Tách đá riêng, ít ngọt, nhiều sữa..."
               class="w-full mt-1 border border-stone-300 rounded-xl p-2.5 text-xs outline-none focus:border-amber-900">
      </div>
    </section>
  </main>

  <!-- THANH TỔNG TIỀN DƯỚI ĐÁY -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-stone-200 p-3.5 z-20">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div>
        <p class="text-[10px] text-stone-400 font-bold uppercase">Tổng (<span id="totalCartCount">0</span> món)</p>
        <p class="text-base font-black text-amber-950" id="totalCartPrice">0đ</p>
      </div>
      <button type="button" id="btnCheckout" onclick="openQrModal()" disabled
              class="px-5 py-3 rounded-2xl font-bold text-xs bg-amber-950 text-white disabled:bg-stone-300 disabled:cursor-not-allowed shadow transition">
        Thanh toán VietQR ⚡
      </button>
    </div>
  </div>

  <!-- POPUP VIETQR -->
  <div id="qrModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-5 max-w-sm w-full space-y-3 text-center shadow-2xl">
      <h3 class="font-bold text-stone-800 text-base">Quét VietQR chuyển khoản</h3>
      <div class="p-2 bg-stone-50 rounded-2xl border border-stone-200 inline-block">
        <img id="vietQrImg" src="" alt="VietQR" class="w-56 h-56 mx-auto rounded-xl">
      </div>
      <div class="bg-amber-50 border border-amber-200 p-2.5 rounded-xl text-xs text-amber-900 text-left space-y-1">
        <p><b>Phòng:</b> <span id="qrRoomText"></span></p>
        <p><b>Tổng tiền:</b> <span id="qrTotalText" class="font-bold text-amber-950"></span></p>
      </div>
      <button onclick="confirmOrderSuccess()" id="btnConfirmPaid" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow">Tôi đã chuyển khoản xong ✅</button>
      <button onclick="closePaymentModal()" class="text-xs text-stone-400 font-medium">Hủy bỏ</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bbageeodpofcdvszyejb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJiYWdlZW9kcG9mY2R2c3p5ZWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczODY2OTEsImV4cCI6MjEwMjk2MjY5MX0.p4vLhapqBH1-BxEK_vH7-KFWCJPH666ftZz4seT2QSs";
    const BANK_CONFIG = { id: "VPBank", no: "32638888", name: "NGUYEN DUONG TRUONG" };

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let dbMenu = [];
    let cart = {};

    async function loadMenu() {
      try {
        const { data, error } = await supabaseClient.from('menu').select('*').order('id', { ascending: true });
        if (error) throw error;
        dbMenu = data || [];
        renderCustomerMenu();
      } catch (err) {
        document.getElementById("menuList").innerHTML = `<div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs text-center">Lỗi tải menu: ${err.message}</div>`;
      }
    }

    function renderCustomerMenu() {
      const listEl = document.getElementById("menuList");
      if (!listEl) return;
      listEl.innerHTML = dbMenu.map(item => `
        <div class="bg-white p-3.5 rounded-2xl border border-stone-200 shadow-sm flex items-center justify-between gap-3">
          <img src="${item.img || 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=200'}" class="w-14 h-14 object-cover rounded-xl border border-stone-100 flex-shrink-0">
          <div class="flex-grow">
            <h4 class="font-bold text-sm text-stone-900 leading-tight">${item.name}</h4>
            <p class="text-[11px] text-stone-400">${item.desc || ''}</p>
            <p class="font-bold text-xs text-[#2B170E] mt-0.5">${Number(item.price).toLocaleString('vi-VN')}đ</p>
          </div>
          ${item.status === 'BẬT' ? `
            <div class="flex items-center gap-2 bg-stone-100 rounded-xl p-1">
              <button type="button" onclick="updateCart(${item.id}, -1)" class="w-7 h-7 bg-white rounded-lg font-bold text-xs shadow-sm">-</button>
              <span id="qty_${item.id}" class="font-bold text-xs w-4 text-center">0</span>
              <button type="button" onclick="updateCart(${item.id}, 1)" class="w-7 h-7 bg-[#2B170E] text-white rounded-lg font-bold text-xs shadow-sm">+</button>
            </div>` : `<span class="text-[11px] font-bold text-stone-400 bg-stone-100 px-2 py-1 rounded-lg">Hết món</span>`}
        </div>
      `).join('');
    }

    function updateCart(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      const qtyEl = document.getElementById(`qty_${id}`);
      if (qtyEl) qtyEl.innerText = cart[id] || 0;
      calculateTotal();
      checkFormValid();
    }

    function calculateTotal() {
      let total = 0, count = 0;
      for (let id in cart) {
        const item = dbMenu.find(m => m.id == id);
        if (item) {
          total += item.price * cart[id];
          count += cart[id];
        }
      }
      document.getElementById("totalCartCount").innerText = count;
      document.getElementById("totalCartPrice").innerText = total.toLocaleString('vi-VN') + "đ";
    }

    function checkFormValid() {
      const room = document.getElementById("roomInput").value.trim();
      const name = document.getElementById("nameInput").value.trim();
      const phone = document.getElementById("phoneInput").value.trim();
      const hasItems = Object.keys(cart).length > 0;
      document.getElementById("btnCheckout").disabled = !(room && name && phone && hasItems);
    }

    function openQrModal() {
      const room = document.getElementById("roomInput").value.trim();
      const timeSlot = document.getElementById("timeSlotInput").value;
      let total = 0;
      for (let id in cart) {
        const item = dbMenu.find(m => m.id == id);
        if (item) total += item.price * cart[id];
      }
      const memo = `CF ${room.replace(/\s+/g, '')}`;
      document.getElementById("vietQrImg").src = `https://img.vietqr.io/image/${BANK_CONFIG.id}-${BANK_CONFIG.no}-compact.png?amount=${total}&addInfo=${encodeURIComponent(memo)}&accountName=${encodeURIComponent(BANK_CONFIG.name)}`;
      document.getElementById("qrTotalText").innerText = total.toLocaleString('vi-VN') + "đ";
      document.getElementById("qrRoomText").innerText = `${room} (${timeSlot})`;
      document.getElementById("qrModal").classList.remove("hidden");
    }

    function closePaymentModal() {
      document.getElementById("qrModal").classList.add("hidden");
    }

    async function confirmOrderSuccess() {
      const btn = document.getElementById("btnConfirmPaid");
      btn.innerText = "Đang ghi nhận đơn...";
      btn.disabled = true;

      const room = document.getElementById("roomInput").value.trim();
      const name = document.getElementById("nameInput").value.trim();
      const phone = document.getElementById("phoneInput").value.trim();
      const deliveryTime = document.getElementById("timeSlotInput").value;
      const note = document.getElementById("noteInput").value.trim();

      let total = 0, orderItems = [];
      for (let id in cart) {
        const item = dbMenu.find(m => m.id == id);
        if (item) {
          total += item.price * cart[id];
          orderItems.push({ id: item.id, name: item.name, qty: cart[id] });
        }
      }

      try {
        const { error } = await supabaseClient.from('orders').insert([{
          room, name, phone, delivery_time: deliveryTime,
          note, items: orderItems, total_price: total, status: 'CHƯA GIAO'
        }]);
        if (error) throw error;
        alert(`🎉 Đặt đơn thành công! Quán sẽ treo trước cửa phòng ${room} lúc [${deliveryTime}].`);
        location.reload();
      } catch (err) {
        alert("Lỗi: " + err.message);
        btn.innerText = "Tôi đã chuyển khoản xong ✅";
        btn.disabled = false;
      }
    }

    loadMenu();
  </script>
</body>
</html>
